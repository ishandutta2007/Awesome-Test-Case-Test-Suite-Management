<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#text-grad);
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      /* Animated Background Elements */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.55; }
      }
      @keyframes scanline {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(1300px); }
      }
      @keyframes streamNode {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .ambient-blob-1 {
        animation: floatSlow 8s ease-in-out infinite;
      }
      .ambient-blob-2 {
        animation: floatSlow 10s ease-in-out infinite reverse;
      }
      .pulse-fx {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 10, 15;
        animation: streamNode 5s linear infinite;
      }
      .scan-beam {
        animation: scanline 7s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="340" fill="url(#grid)" rx="16" />

  <!-- Dynamic / Animated Background Layer -->
  <g class="pulse-fx">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="blur(65px)" />
    <circle cx="1020" cy="240" r="160" fill="#818cf8" filter="blur(75px)" />
    <circle cx="620" cy="170" r="120" fill="#c084fc" filter="blur(70px)" />
  </g>

  <!-- Animated Data Streams in Background (Behind cards and text) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50,290 C 250,220 350,330 600,270 C 850,210 950,300 1150,260" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 50,50 C 300,110 450,20 700,70 C 950,120 1050,40 1150,80" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- Dynamic Tech Pills / Pipeline Stages floating in background -->
  <g class="ambient-blob-1" opacity="0.85">
    <!-- Test Case Pill -->
    <g transform="translate(140, 245)">
      <rect width="170" height="42" rx="21" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#10b981" />
      <text x="42" y="26" class="badge-text">✓ Test Design</text>
    </g>
    <!-- Execution Pill -->
    <g transform="translate(360, 245)">
      <rect width="180" height="42" rx="21" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#6366f1" />
      <text x="42" y="26" class="badge-text">⚡ Test Execution</text>
    </g>
  </g>

  <g class="ambient-blob-2" opacity="0.85">
    <!-- Traceability Pill -->
    <g transform="translate(590, 245)">
      <rect width="190" height="42" rx="21" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#a855f7" />
      <text x="42" y="26" class="badge-text">🔗 Jira Traceability</text>
    </g>
    <!-- Reporting Pill -->
    <g transform="translate(830, 245)">
      <rect width="180" height="42" rx="21" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.2" />
      <circle cx="24" cy="21" r="7" fill="#ec4899" />
      <text x="42" y="26" class="badge-text">📊 Quality Insights</text>
    </g>
  </g>

  <!-- Foreground Header (Kept crisp, elevated and completely readable) -->
  <g id="foreground-content">
    <!-- Mini category pill -->
    <g transform="translate(485, 38)">
      <rect width="230" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="115" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED QA ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="115" text-anchor="middle" class="title">Test Case &amp; Test Suite Management</text>

    <!-- Subtitle -->
    <text x="600" y="152" text-anchor="middle" class="subtitle">A curated index of top SaaS platforms and open-source software for QA planning,</text>
    <text x="600" y="177" text-anchor="middle" class="subtitle">test case repository design, automated test runs, and release traceability.</text>

    <!-- Decorative status line -->
    <line x1="450" y1="210" x2="750" y2="210" stroke="url(#text-grad)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
